commit-msg:
  commands:
    conventional-commits:
      run: sh scripts/hooks/check-commit-message.sh {1}

pre-commit:
  parallel: true
  commands:
    staged-guards:
      run: sh scripts/hooks/check-staged.sh
    secrets:
      run: gitleaks git --pre-commit --redact --staged --verbose
    format:
      glob: "*.rs"
      run: cargo fmt --all -- --check

pre-push:
  parallel: false
  commands:
    secrets:
      run: sh scripts/hooks/check-push-secrets.sh
    notices:
      glob: "{Cargo.lock,Cargo.toml,about.hbs,about.toml,THIRD_PARTY_NOTICES.txt}"
      run: sh scripts/hooks/check-notices.sh
    clippy:
      run: cargo clippy --all-targets -- -D warnings
    tests:
      run: cargo nextest run --all-features --locked
