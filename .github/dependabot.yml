version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      rust-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:05'
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
