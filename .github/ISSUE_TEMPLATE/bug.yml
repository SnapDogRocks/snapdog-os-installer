name: Bug report
description: Report a reproducible problem in SnapDog OS Installer
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not test destructive write failures on media containing valuable data.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Installer version
      placeholder: 0.2.3
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
