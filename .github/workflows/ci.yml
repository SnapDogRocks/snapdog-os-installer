name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTFLAGS: -Dwarnings

jobs:
  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate pull-request commits and title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          ./scripts/check-conventional-commits.py --self-test
          enforcement_sha=$(git log --reverse --diff-filter=A --format=%H \
            "$BASE_SHA..$HEAD_SHA" -- scripts/check-conventional-commits.py | head -1)
          if [[ -n "$enforcement_sha" ]]; then
            BASE_SHA="$enforcement_sha^"
          fi
          ./scripts/check-conventional-commits.py --range "$BASE_SHA" "$HEAD_SHA"
          ./scripts/check-conventional-commits.py --message "$PR_TITLE"
          if git log --format='%B' "$BASE_SHA..$HEAD_SHA" | grep -Eiq \
            '(co-authored-by:.*(codex|claude|copilot|chatgpt)|generated (by|with) (ai|codex|claude|copilot|chatgpt))'; then
            echo 'AI-attribution trailers or generation markers are not permitted.' >&2
            exit 1
          fi

  quality:
    name: Quality and coverage (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          appstream desktop-file-utils libasound2-dev libudev-dev libwayland-dev libx11-xcb-dev
          libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev libxi-dev
          libxrandr-dev pkg-config shellcheck
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
          rustup show active-toolchain
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned Rust tools
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-about,cargo-deny,cargo-llvm-cov,cargo-nextest
      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$install_dir"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Install and validate pinned Lefthook
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/lefthook"
          mkdir -p "$install_dir"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            https://github.com/evilmartians/lefthook/releases/download/v2.1.12/lefthook_2.1.12_Linux_x86_64 \
            --output "$install_dir/lefthook"
          echo '22ff1ad48d1a0f4dca8d6b7e920056c6a9015f9204e5b693858ed9c2db759a16  '"$install_dir/lefthook" | sha256sum --check --status
          chmod 0755 "$install_dir/lefthook"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/lefthook" validate
      - name: Run repository checks
        run: ./scripts/check.sh
      - name: Enforce coverage floor
        run: cargo llvm-cov nextest --locked --all-features --fail-under-lines 45

  linux-arm64:
    name: Check and test (Linux aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          libasound2-dev libudev-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev
          libxkbcommon-x11-dev libxcursor-dev libxi-dev libxrandr-dev pkg-config
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-linux-aarch64
      - name: Run strict checks and tests
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features

  windows:
    name: Check and test (Windows ${{ matrix.arch }})
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust target
        shell: pwsh
        run: |
          rustup toolchain install --no-self-update
          rustup target add '${{ matrix.target }}'
          rustup show active-toolchain
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-${{ matrix.target }}
      - name: Run strict target checks
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires '${{ matrix.vs_component }}' -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual Studio C++ toolchain was not found.' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch '${{ matrix.msvc_arch }}' -HostArch amd64 -SkipAutomaticLocation
          cargo clippy --locked --target '${{ matrix.target }}' --all-targets --all-features -- -D warnings
          cargo check --locked --target '${{ matrix.target }}' --all-targets --all-features
          if ('${{ matrix.arch }}' -eq 'x86_64') { cargo test --locked --all-features }

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan repository history
        run: gitleaks git --redact --verbose .

  ci-success:
    name: CI Success
    if: always()
    needs:
      - conventional-commits
      - quality
      - linux-arm64
      - windows
      - secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          CONVENTIONAL_COMMITS: ${{ needs.conventional-commits.result }}
          QUALITY: ${{ needs.quality.result }}
          LINUX_ARM64: ${{ needs.linux-arm64.result }}
          WINDOWS: ${{ needs.windows.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          for result in "$CONVENTIONAL_COMMITS" "$QUALITY" "$LINUX_ARM64" "$WINDOWS" "$SECRET_SCAN"; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "Required CI job did not pass: $result" >&2
              exit 1
            fi
          done
