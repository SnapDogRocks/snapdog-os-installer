name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag, or vX.Y.Z-suffix for a pipeline test
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTFLAGS: -Dwarnings

jobs:
  validate-tag:
    name: Validate immutable release input
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Match tag, ref, commit, and package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ "$version" == "$package_version" ]] || {
            echo "tag core $version does not match Cargo version $package_version" >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" == "$RELEASE_TAG" ]] || {
            echo "workflow ref $GITHUB_REF_NAME does not match input $RELEASE_TAG" >&2
            exit 1
          }
          [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$GITHUB_SHA" ]] || {
            echo "workflow commit does not match tag target" >&2
            exit 1
          }
          if [[ "$RELEASE_TAG" == "v$version" ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "production release tag must point to a commit contained in main" >&2
              exit 1
            }
            prerelease=false
          else
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Require installer-ready public image manifests
        run: ./scripts/check-live-manifests.py

  quality:
    name: Release quality gate
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          appstream desktop-file-utils libasound2-dev libudev-dev libwayland-dev libx11-xcb-dev
          libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev libxi-dev
          libxrandr-dev pkg-config shellcheck
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-quality
      - name: Install pinned Rust tools
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-about,cargo-deny,cargo-nextest
      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$install_dir"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Run strict release checks
        run: ./scripts/check.sh

  linux:
    name: Linux AppImage (${{ matrix.arch }})
    needs: [validate-tag, quality]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            smoke_image: ubuntu@sha256:0d779ea97881505f5ef0039336ee85edba27519bdba968c284c86ee066a973c8
            smoke_platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            smoke_image: ubuntu@sha256:ecd3706b6b5587d1318e1777359b8563f9db6e8e5a81841f04dc3c7edbefbdc1
            smoke_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Build and test in pinned GLIBC 2.28 container
        run: ./scripts/package-linux.sh --container "${{ matrix.target }}"
      - name: Smoke-test AppImage in clean Ubuntu 22.04
        run: |
          docker run --rm --platform '${{ matrix.smoke_platform }}' \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            '${{ matrix.smoke_image }}' bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update >/dev/null
              apt-get install --yes --no-install-recommends \
                binutils ca-certificates libegl1 libgl1-mesa-dri xauth xvfb >/dev/null
              ./packaging/linux/smoke-test-appimage.sh dist/*.AppImage
            '
      - name: Upload release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows executable (${{ matrix.arch }})
    needs: [validate-tag, quality]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Install pinned Rust target
        shell: pwsh
        run: |
          rustup toolchain install --no-self-update
          rustup target add '${{ matrix.target }}'
          rustup show active-toolchain
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Run strict target checks and package executable
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-Dwarnings -C target-feature=+crt-static'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires '${{ matrix.vs_component }}' -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual Studio C++ toolchain was not found.' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch '${{ matrix.msvc_arch }}' -HostArch amd64 -SkipAutomaticLocation
          cargo clippy --locked --target '${{ matrix.target }}' --all-targets --all-features -- -D warnings
          cargo check --locked --target '${{ matrix.target }}' --all-targets --all-features
          if ('${{ matrix.arch }}' -eq 'x86_64') { cargo test --locked --all-features }
          ./scripts/package-windows.ps1 -Target '${{ matrix.target }}'
      - name: Upload unsigned executable for optional signing
        if: vars.AZURE_TRUSTED_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Upload unsigned release payload
        if: vars.AZURE_TRUSTED_SIGNING_ENABLED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  windows-sign:
    name: Sign Windows executable (${{ matrix.arch }})
    if: vars.AZURE_TRUSTED_SIGNING_ENABLED == 'true'
    needs: [validate-tag, windows]
    runs-on: windows-2025
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Download unsigned executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows
      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign executable with Azure Artifact Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ runner.temp }}\windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: SnapDog OS Installer
          description-url: https://snapdog.cc
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath '${{ runner.temp }}\windows' -Filter '*.exe'
          if ($files.Count -ne 1) { throw "Expected one executable, found $($files.Count)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid signature: $($signature.Status)" }
      - name: Upload signed release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows/*.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Signed and notarized macOS DMG
    needs: [validate-tag, quality]
    runs-on: macos-15
    environment: release
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos-universal
      - name: Install pinned DMG tooling
        run: |
          archive="$RUNNER_TEMP/create-dmg-1.2.2.tar.gz"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            https://github.com/create-dmg/create-dmg/archive/refs/tags/v1.2.2.tar.gz \
            --output "$archive"
          echo '18e8dd7db06c9d6fb590c7877e1714b79b709f17d1d138bd65e4910cc82391bc  '"$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          chmod 0755 "$RUNNER_TEMP/create-dmg-1.2.2/create-dmg"
          echo "$RUNNER_TEMP/create-dmg-1.2.2" >> "$GITHUB_PATH"
      - name: Run strict macOS checks
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo clippy --locked --target aarch64-apple-darwin --all-targets --all-features -- -D warnings
          cargo clippy --locked --target x86_64-apple-darwin --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Build, sign, notarize, and staple DMG
        env:
          MACOS_CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: ./scripts/package-macos.sh
      - name: Upload release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: dist/*-macos-universal.dmg
          if-no-files-found: error
          retention-days: 7

  candidate:
    name: Build signed release candidate
    needs: [validate-tag, quality, linux, windows, windows-sign, macos]
    if: >-
      ${{ always() &&
          needs.validate-tag.result == 'success' &&
          needs.quality.result == 'success' &&
          needs.linux.result == 'success' &&
          needs.windows.result == 'success' &&
          needs.macos.result == 'success' &&
          (needs.windows-sign.result == 'success' || needs.windows-sign.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Download release payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify payload set
        run: ./scripts/release-assets.sh verify release-assets '${{ needs.validate-tag.outputs.version }}' payloads
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Generate one SPDX SBOM per payload
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          while IFS= read -r asset; do
            "$SYFT" scan "file:release-assets/$asset" \
              --output "spdx-json=release-assets/$asset.spdx.json"
          done < <(./scripts/release-assets.sh list-payloads "$VERSION")
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every payload with keyless Sigstore
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          while IFS= read -r asset; do
            cosign sign-blob --yes \
              --bundle "release-assets/$asset.sigstore.json" \
              "release-assets/$asset"
          done < <(./scripts/release-assets.sh list-payloads "$VERSION")
      - name: Generate final checksums and verify candidate
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t checksum_files < <(
            find release-assets -mindepth 1 -maxdepth 1 -type f ! -name SHA256SUMS \
              -printf '%f\n' | LC_ALL=C sort
          )
          (cd release-assets && sha256sum -- "${checksum_files[@]}") \
            > release-assets/SHA256SUMS
          ./scripts/release-assets.sh verify release-assets "$VERSION" complete
      - name: Attest complete candidate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage and verify public prerelease
    needs: [validate-tag, candidate]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Download immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate
      - name: Verify candidate before publication
        run: ./scripts/release-assets.sh verify candidate '${{ needs.validate-tag.outputs.version }}' complete
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          WINDOWS_SIGNED: ${{ vars.AZURE_TRUSTED_SIGNING_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/generated-notes.md"
          {
            if [[ "$WINDOWS_SIGNED" == true ]]; then
              echo '> [!NOTE]'
              echo '> The Windows executables are Authenticode-signed with Azure Artifact Signing.'
            else
              echo '> [!WARNING]'
              echo '> **The Windows executables are not Authenticode-signed.** Verify SHA256SUMS, the Sigstore bundle, or the GitHub attestation before running them.'
            fi
            echo
            echo 'Every installer payload includes an SPDX SBOM and a keyless Sigstore bundle. GitHub build provenance attestations cover every published file.'
            echo
            cat "$RUNNER_TEMP/generated-notes.md"
          } > "$RUNNER_TEMP/release-notes.md"
      - name: Publish candidate as prerelease without replacing bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null || true)
          if [[ -z "$release_json" ]]; then
            [[ "$IS_PRERELEASE" == true ]] || {
              echo "Release Please did not create the required production draft release." >&2
              exit 1
            }
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "SnapDog OS Installer $RELEASE_TAG"
            release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          fi
          draft=$(jq -r .draft <<<"$release_json")
          prerelease=$(jq -r .prerelease <<<"$release_json")
          if [[ "$draft" == true ]]; then
            asset_count=$(jq '.assets | length' <<<"$release_json")
            [[ "$asset_count" == 0 ]] || {
              echo "Draft release already contains assets; refusing to clobber them." >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" candidate/* --repo "$GITHUB_REPOSITORY"
          elif [[ "$prerelease" != true ]]; then
            echo "Release is already stable; refusing to replace published bytes." >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "SnapDog OS Installer $RELEASE_TAG" \
            --verify-tag
      - name: Download public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            public_dir="$RUNNER_TEMP/public-release-$attempt"
            mkdir -p "$public_dir"
            if gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$public_dir"; then
              echo "PUBLIC_DIR=$public_dir" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo 'Could not download the staged public release.' >&2
          exit 1
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify public bytes, signatures, checksums, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/release-assets.sh verify "$PUBLIC_DIR" "$VERSION" complete
          while IFS= read -r asset; do
            cmp "candidate/$asset" "$PUBLIC_DIR/$asset"
            cmp "candidate/$asset.spdx.json" "$PUBLIC_DIR/$asset.spdx.json"
            cmp "candidate/$asset.sigstore.json" "$PUBLIC_DIR/$asset.sigstore.json"
            cosign verify-blob \
              --bundle "$PUBLIC_DIR/$asset.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$PUBLIC_DIR/$asset"
          done < <(./scripts/release-assets.sh list-payloads "$VERSION")
          cmp candidate/SHA256SUMS "$PUBLIC_DIR/SHA256SUMS"
          for file in "$PUBLIC_DIR"/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'select(.draft == false and .prerelease == true) | .tag_name' | grep -Fx "$RELEASE_TAG"

  promote:
    name: Promote verified candidate unchanged
    if: needs.validate-tag.outputs.prerelease == 'false'
    needs: [validate-tag, stage]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Download staged public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir public-release
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Reverify public candidate before promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/release-assets.sh verify public-release "$VERSION" complete
          while IFS= read -r asset; do
            cosign verify-blob \
              --bundle "public-release/$asset.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "public-release/$asset"
          done < <(./scripts/release-assets.sh list-payloads "$VERSION")
          for file in public-release/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
      - name: Promote prerelease to stable and latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false \
            --latest \
            --verify-tag
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' | grep -Fx "$RELEASE_TAG"

  notify-website:
    name: Update and verify SnapDog website
    needs: [validate-tag, promote]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    steps:
      - name: Mint short-lived website automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: SnapDogRocks
          repositories: snapdog-web
          permission-actions: read
          permission-contents: write
      - name: Dispatch website update and wait for its workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dispatched_at=$(date -u +%s)
          gh api --method POST \
            repos/SnapDogRocks/snapdog-web/dispatches \
            -f event_type=snapdog-os-installer-release \
            -F "client_payload[tag]=$RELEASE_TAG" \
            -F "client_payload[source_run_id]=$GITHUB_RUN_ID"
          run_id=
          for _ in {1..30}; do
            run_id=$(gh run list \
              --repo SnapDogRocks/snapdog-web \
              --workflow update-installer-release.yml \
              --event repository_dispatch \
              --limit 10 \
              --json databaseId,createdAt \
              --jq ".[] | select((.createdAt | fromdateiso8601) >= $dispatched_at) | .databaseId" | head -1)
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || {
            echo 'Website update workflow did not start.' >&2
            exit 1
          }
          gh run watch "$run_id" --repo SnapDogRocks/snapdog-web --exit-status
      - name: Verify updated metadata on main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            tag=$(gh api \
              repos/SnapDogRocks/snapdog-web/contents/src/data/snapdog-os-installer-release.json \
              -H 'Accept: application/vnd.github.raw+json' \
              --jq .tag 2>/dev/null || true)
            [[ "$tag" == "$RELEASE_TAG" ]] && exit 0
            sleep 10
          done
          echo "snapdog-web main does not reference $RELEASE_TAG" >&2
          exit 1
