name: Dependabot Notices

# Dependabot bumps change Cargo.lock, which makes THIRD_PARTY_NOTICES.txt stale and fails the
# repository checks. This workflow regenerates the file on Dependabot's cargo branches and starts CI
# on the new commit (a push with GITHUB_TOKEN does not trigger workflows by itself).
#
# pull_request_target gives the job a write token, so it is limited to Dependabot's own cargo
# branches in this repository. The job needs no secrets and does not use the `release` environment.
# `cargo about` reads cargo metadata and runs no build scripts of the updated dependencies.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - Cargo.lock
      - Cargo.toml
      - THIRD_PARTY_NOTICES.txt

permissions: {}

concurrency:
  group: dependabot-notices-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  notices:
    name: Regenerate third-party notices
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'dependabot/cargo/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
      - name: Install cargo-about
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about@0.9.2
      - name: Regenerate the notices
        run: ./scripts/generate-notices.sh
      - name: Commit the notices and start CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- THIRD_PARTY_NOTICES.txt; then
            echo 'THIRD_PARTY_NOTICES.txt is current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add THIRD_PARTY_NOTICES.txt
          git commit --message 'chore(deps): regenerate third-party notices'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" \
            "https://github.com/$REPOSITORY" "HEAD:refs/heads/$HEAD_REF"
          gh workflow run ci.yml --repo "$REPOSITORY" --ref "$HEAD_REF"
